services:
  tabroom-backend:
    build: .
    image: tabroom-backend:latest
    container_name: tabroom-backend
    ports:
      - "8081:8081"
    volumes:
      - ./local_storage:/app/local_storage
      - ./users:/app/users
    environment:
      - PORT=8081
      - TESTING_MODE=true
      - REQUIRE_USER_APPROVAL=false
    restart: unless-stopped
