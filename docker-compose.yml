services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tabroom-tailscale
    hostname: tabroom2
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    ports:
      - "${PORT:-8081}:8081"
    restart: unless-stopped

  tabroom-backend:
    build: .
    image: tabroom-backend:latest
    container_name: tabroom-backend
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./local_storage:/app/local_storage
      - ./users:/app/users
    environment:
      - PORT=8081
      - TESTING_MODE=true
      - REQUIRE_USER_APPROVAL=false
    restart: unless-stopped
